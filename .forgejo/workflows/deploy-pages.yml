name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Setup Node
        uses: https://github.com/actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate build configuration
        env:
          OPENAPI_SERVICES: ${{ vars.OPENAPI_SERVICES }}
        run: test -n "$OPENAPI_SERVICES"

      - name: Build documentation
        env:
          OPENAPI_SERVICES: ${{ vars.OPENAPI_SERVICES }}
        run: pnpm build

      - name: Remove oversized static asset
        run: rm -f dist/public/llms-full.txt

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist/public --project-name=thetree-docs --branch=main
